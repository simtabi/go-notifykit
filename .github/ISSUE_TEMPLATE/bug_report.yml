name: Bug report
description: Report a problem with go-notifykit
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug, including the exact command you ran.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: go-notifykit version
      description: The version from your go.mod (`go list -m github.com/simtabi/go-notifykit/src`).
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / arch
      placeholder: "macOS 26 arm64 / Ubuntu 24.04 amd64 / Windows 11"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste output. Redact any tokens or private data.
      render: shell
